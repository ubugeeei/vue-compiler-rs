[workspace]
resolver = "3"
members = [
  "crates/vize_carton",
  "crates/vize_relief",
  "crates/vize_armature",
  "crates/vize_croquis",
  "crates/vize_croquis_cf",
  "crates/vize_atelier_core",
  "crates/vize_atelier_dom",
  "crates/vize_atelier_vapor",
  "crates/vize_atelier_ssr",
  "crates/vize_atelier_sfc",
  "crates/vize_atelier_jsx",
  "crates/vize_vitrine",
  "crates/vize",
  "crates/vize_canon",
  "crates/vize_patina",
  "crates/vize_glyph",
  "crates/vize_musea",
  "crates/vize_maestro",
  "crates/vize_curator",
  "crates/vize_davinci",
  "crates/vize_davinci_derive",
  "crates/vize_s2",
  "crates/vize_s1_to_s2",
  "crates/vize_s1",
  "crates/vize_fresco",
  "crates/vize_marquette",
  "crates/vize_doctor",
  "tools/benchmarks/crates/davinci_harness",
  "tools/benchmarks/crates/vize",
  "tests/davinci_test_support",
  "tests/vize_test_runner",
]

[workspace.package]
version = "0.404.5"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/ubugeeei-prod/vize"

[workspace.dependencies]
# Publishable internal crates (path for local dev, version fallback for crates.io)
vize_carton = { path = "crates/vize_carton", version = "=0.404.5" }
vize_relief = { path = "crates/vize_relief", version = "=0.404.5" }
vize_armature = { path = "crates/vize_armature", version = "=0.404.5" }
vize_croquis = { path = "crates/vize_croquis", version = "=0.404.5" }
vize_croquis_cf = { path = "crates/vize_croquis_cf", version = "=0.404.5" }
vize_atelier_core = { path = "crates/vize_atelier_core", version = "=0.404.5" }
vize_atelier_dom = { path = "crates/vize_atelier_dom", version = "=0.404.5" }
vize_atelier_vapor = { path = "crates/vize_atelier_vapor", version = "=0.404.5" }
vize_atelier_ssr = { path = "crates/vize_atelier_ssr", version = "=0.404.5" }
vize_atelier_sfc = { path = "crates/vize_atelier_sfc", version = "=0.404.5", default-features = false }
vize_atelier_jsx = { path = "crates/vize_atelier_jsx", version = "=0.404.5" }
vize_musea = { path = "crates/vize_musea", version = "=0.404.5" }
vize_patina = { path = "crates/vize_patina", version = "=0.404.5" }
vize_canon = { path = "crates/vize_canon", version = "=0.404.5", default-features = false }
vize_fresco = { path = "crates/vize_fresco", version = "=0.404.5", default-features = false }
vize_marquette = { path = "crates/vize_marquette", version = "=0.404.5" }
vize_doctor = { path = "crates/vize_doctor", version = "=0.404.5" }

# Workspace-only internal crates (always use the local path)
davinci_harness = { path = "tools/benchmarks/crates/davinci_harness" }
davinci_test_support = { path = "tests/davinci_test_support" }
vize_vitrine = { path = "crates/vize_vitrine", default-features = false }
vize_glyph = { path = "crates/vize_glyph" }
vize_maestro = { path = "crates/vize_maestro" }
vize_curator = { path = "crates/vize_curator" }

# Publishable Davinci stage infrastructure. Stage crates keep their physical
# names and version fallbacks so a publishable consumer can resolve the same
# dependency graph from crates.io.
vize_davinci = { path = "crates/vize_davinci", version = "=0.404.5" }
vize_davinci_derive = { path = "crates/vize_davinci_derive", version = "=0.404.5" }

# Davinci stage aliases. These are the preferred implementation names for new
# code; S0 still aliases the published Carton package until a compatibility
# change can move it to a physical stage name.
vize_s0 = { package = "vize_carton", path = "crates/vize_carton", version = "=0.404.5" }
vize_s1 = { path = "crates/vize_s1", version = "=0.404.5" }
vize_s2 = { path = "crates/vize_s2", version = "=0.404.5" }
vize_s1_to_s2 = { path = "crates/vize_s1_to_s2", version = "=0.404.5" }

# OXC dependencies (pinned to a specific upstream revision for reproducibility)
oxc_parser = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_ast = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_ast_visit = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_span = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_allocator = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_syntax = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_diagnostics = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_semantic = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_transformer = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_codegen = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
# oxc_formatter is not yet on crates.io, so vize_glyph is excluded from crates.io publish.
# `oxc_formatter_core` carries the language-agnostic option types (`IndentStyle`,
# `IndentWidth`, `LineEnding`, `LineWidth`) that `oxc_formatter` takes but does not
# re-export; it is `publish = false` upstream for the same reason.
oxc_formatter = { version = "=0.60.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_formatter_core = { version = "=0.60.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }

# Serialization and schema formats
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=1.1.4"
lsp-types = "=0.97.0"
pklrust = "=0.9.0"

# CLI, async, and IDE runtime
clap = { version = "=4.6.6", features = ["derive"] }
futures = "=0.3.32"
tower = { version = "=0.4.13", default-features = false }
tower-lsp = { version = "=0.20.0", default-features = false, features = ["runtime-agnostic"] }
async-trait = "=0.1.89"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
parking_lot = "=0.12.5"
ropey = "=1.6.1"
dirs = "=6.0.0"
which = "=8.0.5"
walkdir = "=2.5.0"
ignore = "=0.4.33"
glob = "=0.3.4"
globset = "=0.4.20"
rayon = "=1.12.0"
regex-lite = "=0.1.9"
tempfile = "=3.27.0"

# NAPI / WASM / Web
napi = { version = "=3.9.0", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "=3.5.6"
napi-build = "=2.3.2"
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "=0.6.5"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["console"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

# Proc-macro toolkit (host build dependencies; versions match the lockfile)
proc-macro2 = "=1.0.106"
quote = "=1.0.45"
syn = "=2.0.117"

# Utilities
thiserror = "=2.0.20"
rustc-hash = "=2.1.3"
bitflags = { version = "=2.13.1", features = ["serde"] }
once_cell = "=1.21.4"
compact_str = { version = "=0.10.0", features = ["serde"] }
phf = { version = "=0.13.1", features = ["macros"] }
memoffset = "=0.9.1"
memchr = "=2.8.3"
regex = "=1.13.1"
smallvec = { version = "=1.15.2", features = ["union"] }
dashmap = "=6.2.1"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }
sha2 = "=0.11.0"
htmlize = { version = "=1.1.0", features = ["unescape"] }
libc = "=0.2.189"
# Moves a recursive AST pass onto a heap-allocated stack when the thread stack
# runs low, so template nesting depth costs heap instead of stack. See
# `vize_carton::recursion` for why the compiler needs it.
stacker = "=0.1.25"

# Allocator
mimalloc = "=0.1.52"

# CSS
lightningcss = "=1.0.0-alpha.72"
parcel_selectors = "=0.28.3"

# Terminal / layout
crossterm = "=0.29.0"
taffy = "=0.10.1"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

# Testing and benchmarking
insta = { version = "=1.48.0", features = ["toml"] }
criterion = "=0.8.2"

# Published corsa crates
corsa = { package = "corsa", version = "=1.14.0" }
corsa_lsp = { package = "corsa_lsp", version = "=1.14.0" }
corsa_runtime = { package = "corsa_runtime", version = "=1.14.0" }

[profile.release]
# Release artifacts are benchmarked and shipped from this profile. Fat LTO plus
# one codegen unit slows local release builds, but it lets LLVM optimize across
# crate boundaries in the parser/codegen hot paths that dominate CLI and native
# package benchmarks. The CI profile below stays intentionally cheaper.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.ci]
inherits = "dev"
debug = false
incremental = false
codegen-units = 256

# The PR benchmark gate compares base and head CLI performance, so its binaries
# must be optimized or abstraction-cost regressions stay invisible. Thin LTO
# with multiple codegen units keeps the gate's per-SHA build cost well below
# the fat-LTO release profile while staying representative of it.
[profile.ci-opt]
inherits = "release"
lto = "thin"
codegen-units = 16
