[target.phase-2]
# The phase-2 improvement target, pinned at phase start per P2-12a, so the
# exit gate has a defined "before" and cannot be scored against a number
# chosen after the result is known (the P1-13 miss this task exists to
# prevent). Quantities are the machine-independent ones only; wall time is
# report-only until the Blacksmith recording lands (P0-4's open pending).
#
# **Review point:** the maintainer sets these numbers. CI checks that the
# table exists, that every value is present and non-zero, and that the
# phase-start rev names a real commit — never that the numbers are the right
# ones.
phase_start_rev = "232870a83506cf3312cc8ef02e91c8b73ac12d2b"
phase_start_date = "2026-08-19"
# The DOM backend is phase 2's strangler target (P2-11), so the target is
# stated on the DOM lane: the transform lane and DOM codegen become fused S2
# passes, which is one walk instead of two and drives node visits toward the
# transform-only component recorded in walk-baseline.md.
dom_walks_max = 1
dom_visits_ratio_max = 0.80
# `stress-wide` is the control row: one element with 100 attributes is 3
# visits, which is attribute work rather than traversal work. It is excluded
# from the ratio target because a change there is measuring something else.
dom_visits_control_fixture = "stress-wide"
# S2 must not be paid for in allocations: the `atelier_dom_compile_*` entries
# in [bench] may not regress, which the exact alloc gate already enforces per
# bench. Stated here as the phase-level commitment rather than a second gate.
dom_compile_allocs_ratio_max = 1.00
# SSR and Vapor stay on the legacy path this phase (P3), so their [traversal]
# entries are held, not improved.
ssr_visits_ratio_max = 1.00
vapor_visits_ratio_max = 1.00
wall_time = "report-only"

