davinci_pipeline_no_observer = { wall_p50_ns = 0, allocs = 0, rss_peak_bytes = 0, wall_tolerance = 0.05 }

# Compact-storage probes. Setup is excluded with stage windows so these exact
# allocation counts localize the v-for split and v-on emit paths. The wall
# side is report-only (wall_p50_ns = 0): the sub-2us stage windows vary more
# than the 10% ceiling across CI runners (764-855ns and 1494-1906ns observed
# within one day, PRs #4857/#4877), so the deterministic alloc and
# per-platform peak gates carry these probes until a reference-runner
# recording methodology lands.
