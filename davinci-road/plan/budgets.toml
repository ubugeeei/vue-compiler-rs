# Pass-manager zero-cost pair (P2-3). The claim these two exist to gate is that
# `NoObserver`'s empty bodies inline away, so running a plan through the
# observer driver costs what running it without the driver costs. `allocs` is
# where that is enforced: both entries are a *measured* zero over the same
# four-pass fixture pipeline, and the exact alloc gate fails either one that
# starts allocating. Wall p50 is 6 ns for both locally, which is under
# criterion's resolution for a routine this small and is exactly why the gate
# is on the alloc side.
