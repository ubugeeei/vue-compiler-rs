[package]
name = "vize_atelier_jsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atelier JSX - Shared JSX/TSX lowering layer for Vize"
metadata.vize.stability = "compatibility-preview"

[dependencies]
# Internal crates
vize_s0 = { workspace = true }
vize_s2 = { workspace = true }
vize_relief = { workspace = true }
vize_croquis = { workspace = true }
vize_atelier_core = { workspace = true }
vize_s1_to_s2 = { workspace = true }
vize_atelier_vapor = { workspace = true }
# Reused for the first-cut JSX Vapor SSR render path (#1533): the lowered
# RootNode is the same `vize_relief` type the SSR codegen consumes, so the
# `ssrRender` HTML-string generator is shared rather than reimplemented.
vize_atelier_ssr = { workspace = true }
# Reused for scoped-CSS rewriting (`style::apply_scoped_css`) and scope-id
# generation (`generate_bundler_scope_id`). No template/CSS preprocessing is
# needed here, so the heavy `native`/lightningcss default feature is dropped.
vize_atelier_sfc = { workspace = true, default-features = false }

# OXC for JSX/TSX parsing and diagnostics
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_semantic = { workspace = true }
oxc_syntax = { workspace = true }
oxc_span = { workspace = true }
oxc_diagnostics = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Mirror the legacy parser/AST surface across the SFC and SSR dependencies.
legacy = ["vize_atelier_sfc/legacy", "vize_atelier_ssr/legacy"]

[[bench]]
name = "jsx_compile"
harness = false
