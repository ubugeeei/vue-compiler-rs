[package]
name = "vize_atelier_dom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atelier DOM - The DOM compiler workshop for Vize"
metadata.vize.stability = "alpha-supported"

[features]
legacy = ["vize_atelier_core/legacy"]

# Arms the Davinci DOM differential lanes by exposing
# `compile_template_legacy_with_options` — the shipped parse/transform/codegen
# lane with the S2 emitter declined. The corpus comparators need it as their
# *old* side: since the P2-11 production switch the ordinary entry points
# route through S2, so a differential built on them compares S2 to itself.
# Adds no dependency and no production code path; off in production builds,
# exactly like `vize_atelier_core`'s feature of the same name.
davinci-differential = []

[dependencies]
vize_s0 = { workspace = true }
vize_atelier_core = { workspace = true }
vize_croquis = { workspace = true }
# Profiled source-map-free DOM compiles can render through the S2 backend.
# TypeScript expression erasure is part of the public DOM option surface, so
# keep the stage library's opt-in implementation available in the production
# graph.
vize_s1_to_s2 = { workspace = true, features = ["typescript"] }

phf = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# S2 test and benchmark fixtures still use the stage diagnostics/types.
vize_davinci = { workspace = true }

[[bench]]
name = "davinci"
harness = false

[[test]]
name = "davinci_s2_filters"
required-features = ["legacy"]
