name: Check
on:
  push:
    branches: [main, davinci]
  pull_request:
    branches: [main, davinci]
  # Daily cadence for nix-flake and source-coverage; both skip pull requests.
  schedule:
    # 03:11 UTC daily (~12:11 JST). Offset from native-smoke and e2e to spread
    # GitHub Actions concurrency budget.
    - cron: "11 3 * * *"

concurrency:
  group: check-v2-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    # Nix store cache restore + `nix flake check` was the second-slowest PR
    # gate after playground-test. The flake itself rarely changes between
    # PRs, so run it on push-to-main (catches merge regressions within
    # minutes) and on the daily schedule, not on every PR.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Check flake
        run: nix flake check
  fmt-rust:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all -- --check
  check-js:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-js-check-runtime
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Check JS/TS
        run: vp run --filter './npm/native' build:debug && vp run --workspace-root check:ci
  semver-checks:
    name: cargo-semver-checks (${{ matrix.crate }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    # Keep this list in sync with crates published by tools/moon/cmd/publish_crates.
    strategy:
      fail-fast: false
      matrix:
        crate:
          - vize_armature
          - vize_atelier_core
          - vize_atelier_dom
          - vize_atelier_sfc
          - vize_atelier_ssr
          - vize_atelier_vapor
          - vize_carton
          - vize_croquis
          - vize_fresco
          - vize_musea
          - vize_relief
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
      - uses: ./.github/actions/setup-rust-script
      - name: Resolve SemVer change marker
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: rust-script tools/commands/ci/github/semver-change-marker.rs "$RUNNER_TEMP/semver-change-marker.txt"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: semver-checks
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-semver-checks
      - name: Check public API SemVer compatibility
        env:
          BASELINE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          case "$BASELINE_REV" in 0000000000000000000000000000000000000000) BASELINE_REV="";; esac
          SEMVER_CHANGE_MARKER="$(cat "$RUNNER_TEMP/semver-change-marker.txt")"
          SEMVER_ARGS=()
          if printf '%s\n' "$SEMVER_CHANGE_MARKER" | grep -Eq '^[[:alnum:]_-]+(\([^)]+\))?!:|^BREAKING CHANGE:'; then
            SEMVER_ARGS+=(--release-type major)
          fi
          if [ -n "$BASELINE_REV" ]; then
            cargo semver-checks check-release --package ${{ matrix.crate }} --baseline-rev "$BASELINE_REV" "${SEMVER_ARGS[@]}"
          else
            cargo semver-checks check-release --package ${{ matrix.crate }} "${SEMVER_ARGS[@]}"
          fi
  security-audit:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: ./.github/actions/setup-rust-script
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Audit production npm dependencies
        run: rust-script tools/commands/ci/npm-audit.rs
      - name: Install cargo-audit
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings
  node-engine-compat:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Check package engine matrix
        run: node --test tests/tooling/node-engine-matrix.test.ts tests/tooling/package-manifests.test.ts

  check-vize-apps:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: check-vize-apps
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build vize CLI
        run: cargo build --profile ci -p vize
      - name: Install vize CLI
        run: sudo install -m 0755 target/ci/vize /usr/local/bin/vize
      - name: Check Vize app fixtures
        run: vp run --workspace-root check:ci:vize-apps

  vue-parity:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: vue-parity
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/check-vue-parity
  test-scripts:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # Restoration of the original setup after the trim in #519 broke
    # main: lsp-smoke.test.ts launches `vize lsp` (falls back to
    # `cargo run -p vize` when no binary is staged), moonbit-*.test.ts
    # files shell out to `moon run` for release-script coverage, and
    # several tests assert on artifacts produced by the built CLI.
    # Each of those was treated as not-needed and reintroduced a
    # regression; keeping the full bootstrap is the safe answer.
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Hydrate CLI diagnostic fixture and install JS dependencies
        run: git submodule update --init --force --depth 1 -- tests/_fixtures/_git/ant-design-vue tests/_fixtures/_git/create-vue tests/_fixtures/_git/vue-select && vp install --frozen-lockfile --prefer-offline
      - name: Build vize CLI
        run: cargo build --profile ci -p vize
      - name: Install vize CLI
        run: sudo install -m 0755 target/ci/vize /usr/local/bin/vize
      - name: Test release scripts
        run: vp run --workspace-root test:scripts
  editor-extensions:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/package-editor-extensions
  editor-host-smoke:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/vscode-host-smoke
  build-js-packages:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: build-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Verify declarations, build native package, and check UI package
        run: vp run --filter './npm/fresco-native' check:generated && vp run --filter './npm/fresco-native' check:types && vp run --filter './npm/native' build:ci && vp run --filter './npm/ui' check
      - name: Build JS packages
        run: vp run --workspace-root build:packages
      - name: Stage shared JS build artifacts
        run: |
          mkdir -p .artifacts/shared-js-build/npm/native
          mkdir -p .artifacts/shared-js-build/npm/cli
          mkdir -p .artifacts/shared-js-build/npm/builder/vite
          cp npm/native/*.node .artifacts/shared-js-build/npm/native/
          cp npm/native/index.js npm/native/index.d.ts .artifacts/shared-js-build/npm/native/
          cp -R npm/cli/dist .artifacts/shared-js-build/npm/cli/
          cp -R npm/builder/vite/dist .artifacts/shared-js-build/npm/builder/vite/
      - name: Upload shared JS build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-js-build
          path: .artifacts/shared-js-build/
          if-no-files-found: error
          retention-days: 7

  test-js-packages:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Test JS packages
        run: vp run --workspace-root test:js

  clippy-and-test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::wildcard_imports && cargo clippy -p vize_maestro --tests -- -D warnings && rust-script tools/commands/ci/github/check-maestro-feature-contract.rs
      - name: Davinci no_std stage-library portability lanes (TS-24)
        run: cargo build -p vize_davinci -p vize_s1 -p vize_s2 -p vize_s1_to_s2 --lib --target wasm32-wasip2 && cargo build -p vize_davinci -p vize_s1 -p vize_s2 -p vize_s1_to_s2 --lib --target wasm32-wasip2 --no-default-features
      - name: Davinci allocation gate
        run: cargo bench -p vize_s1_to_s2 --bench davinci_storage -- --quick && cargo bench -p vize_patina --bench davinci_markup -- --quick && rust-script tools/commands/davinci/bench-compare.rs --bench s1_to_s2_lower_vfor_three_aliases --bench s1_to_s2_emit_von_two_per_bucket --bench s1_to_s2_emit_p2_11_dom_surface --bench patina_jsx_markup_one_root
      - name: Upload Davinci allocation bench reports
        if: ${{ always() }}
        uses: ./.github/actions/upload-davinci-compact-storage-bench-reports
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Test
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: cargo test --workspace && cargo test -p vize_s1_to_s2 --features davinci-differential --test davinci_lowering_corpus -- --nocapture && cargo test -p vize_s1_to_s2 --features davinci-differential --test davinci_dom_corpus -- --nocapture && cargo test -p vize_atelier_jsx --features davinci-differential --lib vdom::s2_differential::s2_vdom_admitted_cases_match_relief_codegen -- --exact && cargo test -p vize --features legacy --test check_nuxt_tsconfig_isolation_cli && cargo test -p vize_atelier_core --features legacy --test davinci_s2_transform_vue2 && cargo test -p vize_vitrine --no-default-features --features wasm
  coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false

      # The fixture-coverage runner evaluates the SFC Pkl fixtures.
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Coverage report
        run: rust-script tools/commands/ci/github/write-coverage-summary.rs

  source-coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    # Source coverage is a push/daily trend metric; fixture and compiler/lint gates stay per PR.
    if: ${{ github.event_name != 'pull_request' }}
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-source
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-llvm-cov

      - name: Source coverage report
        run: vp run --workspace-root coverage:source

      - name: Verify source coverage summary
        run: test -s target/llvm-cov/source-summary.json

      - name: Upload source coverage summary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-source-coverage-summary
          path: target/llvm-cov/source-summary.json
          if-no-files-found: error
          retention-days: 14

  branch-coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    # Run the strict nightly gate before merge as well as on main. A main-only
    # gate allowed stale instrumented artifacts to distort metrics across many PRs.
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-branch
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-llvm-cov

      - name: Branch coverage report
        run: vp run --workspace-root coverage:source:branch

      - name: Verify branch coverage summary
        run: test -s target/llvm-cov/source-branch-summary.json

      - name: Upload branch coverage summary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-branch-coverage-summary
          path: target/llvm-cov/source-branch-summary.json
          if-no-files-found: error
          retention-days: 14

  playground-test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    needs:
      - build-js-packages
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Rust is always needed for @vizejs/native (used by vite-plugin-vize)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: playground-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - name: Cache WASM build
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: playground/src/wasm
          key: ${{ runner.os }}-wasm-${{ hashFiles('crates/**/*.rs', 'Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      - name: Build WASM
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: moon run --target native tools/moon/cmd/github/build_vitrine_wasm -- playground/src/wasm

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: moon run --target native tools/moon/cmd/github/vp_install -- --filter './playground...' --filter './npm/builder/vite...' --filter './npm/cli...' --filter './npm/native...'

      - name: Download shared JS build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-js-build
          path: .

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-playwright-browsers

      - name: Run playground tests
        run: vp run --filter './playground' test:browser

      - name: Run VRT
        run: vp run --filter './playground' test:vrt
        continue-on-error: true
        id: vrt

      - name: Upload VRT report
        if: steps.vrt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-vrt-report
          path: playground/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Update VRT snapshots
        if: steps.vrt.outcome == 'failure'
        run: vp run --filter './playground' test:vrt:update

      - name: Fail if VRT failed
        if: steps.vrt.outcome == 'failure'
        run: exit 1

      - name: Upload VRT diff artifacts
        if: steps.vrt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-diff
          path: playground/e2e/vrt/test-results/
          retention-days: 7

  test-report:
    name: test-report
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - nix-flake
      - fmt-rust
      - check-js
      - security-audit
      - semver-checks
      - node-engine-compat
      - check-vize-apps
      - vue-parity
      - test-scripts
      - editor-extensions
      - editor-host-smoke
      - build-js-packages
      - test-js-packages
      - clippy-and-test
      - coverage
      - source-coverage
      - branch-coverage
      - playground-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: ./.github/actions/setup-rust-script
      - name: Collect test inventory
        run: node tools/benchmarks/scripts/test-inventory.mjs --json test-inventory.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload test inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-inventory
          path: test-inventory.json
          retention-days: 14
      # Runs last so the inventory is collected and uploaded either way.
      - name: Require every needed job to succeed
        env: { NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: rust-script tools/commands/ci/github/require-needs-success.rs

  test-report-comment:
    name: test-report-comment
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - test-report
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Download test inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-inventory
      - name: Comment detailed test report
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_REPORT_COMMENT_KEY: ${{ github.event.pull_request.head.sha }}
          TEST_REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_REPORT_RUN_ID: ${{ github.run_id }}
          TEST_REPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_REPORT_WORKFLOW_NAME: ${{ github.workflow }}
        run: node tools/benchmarks/scripts/comment-test-report.mjs --inventory test-inventory.json --summary "$GITHUB_STEP_SUMMARY"
